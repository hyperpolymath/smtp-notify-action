# SPDX-License-Identifier: MPL-2.0
name: 'SMTP Notify'
# The GitHub Marketplace refuses to publish a description of 125 characters or
# more, and it reads this file from the RELEASE TAG, not from main — so this
# line has to be short before a tag is cut, not after the publish form says so.
# It is measured on the PARSED value: a folded `>-` scalar is one long string
# to GitHub, and a `grep '^description:'` reports the marker's length (2) and
# false-passes. See scripts/check-action.sh, which counts it the same way and
# fails the build if it grows again. The full description lives in README.adoc,
# which has no length limit and renders on the listing page.
description: 'Send notification email over SMTPS or STARTTLS, or post to a newsgroup over NNTPS. Static Zig binary, no Node.'
author: 'hyperpolymath'
branding:
  icon: 'mail'
  color: 'purple'

inputs:
  server_address:
    description: 'SMTP server host name'
    required: true
  server_port:
    description: >-
      Server port. Empty = the port the protocol and transport imply, so an
      ordinary workflow never needs this. SMTP: 465 implicit TLS, 587
      STARTTLS, 25 plaintext. NNTP: 563 implicit TLS (NNTPS), 119 for
      STARTTLS and plaintext.
    required: false
    default: ''
  protocol:
    description: >-
      "smtp" (default) sends mail; "nntp" posts one article to the newsgroups
      named by `newsgroups`. Chosen explicitly and never inferred from which
      other inputs are set, so a workflow that mixes the two is told which
      mistake it made. NNTP always authenticates (AUTHINFO USER/PASS, the
      `username`/`password` inputs) and always posts exactly one article.
    required: false
    default: 'smtp'
  secure:
    description: >-
      Transport selection, fail-closed, for both protocols. "true" (default)
      or "implicit" = implicit TLS from the first byte: SMTPS (normally port
      465), or NNTPS (normally port 563) with protocol: nntp. "false" or
      "starttls" = start in the clear and upgrade with STARTTLS — RFC 3207 on
      the submission port (normally 587), RFC 4642 on the news port (normally
      119); the upgrade is MANDATORY, so a server that does not advertise
      STARTTLS fails the step rather than being talked to in the clear. "plaintext" = no TLS at all, which sends the password
      base64-encoded in the clear; use it only against a containerized test
      sink. Any other value is rejected outright. Note the difference from
      dawidd6/action-send-mail, where "false" means "STARTTLS when the server
      offers it": here a server that does not offer it is an error, not a
      downgrade.
    required: false
    default: 'true'
  username:
    description: >-
      Username (SMTP: AUTH PLAIN or AUTH LOGIN, chosen from what the server
      offers. NNTP: AUTHINFO USER, always used).
    required: false
    default: ''
  password:
    description: >-
      Password. Reaches the binary via the environment, never argv,
      so it cannot leak into process listings.
    required: false
    default: ''
  from:
    description: 'From: header value, e.g. "GitHub Push <bot@example.org>"'
    required: false
    default: ''
  to:
    description: >-
      Recipients, separated by commas and/or whitespace. SMTP only: a news
      article has no envelope, it is addressed by its Newsgroups header.
    required: false
    default: ''
  newsgroups:
    description: >-
      One or more newsgroup names, comma-separated (e.g. "comp.lang.idris" or
      "alt.test, uk.rec.cycling"), for protocol: nntp. RFC 5536 §3.1.4
      well-formedness is enforced: the names must exist on the server, `*` and
      `control`/`control.*` are refused, and anything malformed fails the step
      rather than being repaired.
    required: false
    default: ''
  subject:
    description: >-
      Subject: header value. Non-ASCII text is sent as RFC 2047 UTF-8
      encoded-words; CR/LF or invalid UTF-8 is rejected, never sanitized.
    required: false
    default: ''
  content_language:
    description: >-
      Optional Content-Language header (RFC 3282): one or more RFC 5646
      language tags, comma-separated, e.g. "en-GB" or "en, cy". Shape-checked
      (1-8 ASCII letters/digits per subtag, first alphabetic; no registry
      lookup); a value that fails fails the step rather than being repaired.
    required: false
    default: ''
  body:
    description: 'Plain-text body (no HTML, images, or tracking content; dot-stuffed on the wire: RFC 5321 for SMTP, RFC 3977 for NNTP)'
    required: false
    default: ''
  diagnose:
    description: >-
      "true" = non-delivery probe. SMTP only: Reports DNS, TCP, TLS, EHLO and
      AUTH as separate stages, one line each, then MSG (whether the message
      inputs would pass local checks), and names the stage that failed. AUTH reports
      which mechanism this client would use; no credential is sent, so a wrong
      password is NOT detected. Nothing is delivered.
    required: false
    default: 'false'
  handshake_only:
    description: >-
      "true" = connect, TLS handshake, EHLO/CAPABILITIES, QUIT. No auth,
      nothing sent or posted. For canary/CI verification against a real server
      without delivering mail; the news equivalent of the probe.
    required: false
    default: 'false'
  timeout_seconds:
    description: >-
      Whole-run deadline in seconds. A watchdog bounds the entire run —
      connection, TLS handshake, and every read and write — and fails the step
      with a diagnostic if it is exceeded. This is deliberately a whole-run
      deadline rather than a per-operation one: see BUSTFILE.adoc,
      BUST-2026-001 and BUST-2026-002.
    required: false
    default: '60'

runs:
  using: 'composite'
  steps:
    - name: Fetch and verify the smtp-notify binary
      shell: bash
      run: |
        set -euo pipefail
        # The SHA-256 pins below are part of this commit: the action ref that
        # consumers pin fully determines the binary that runs. The binaries
        # are byte-reproducible from source (stripped static musl builds,
        # zig 0.16.0); the release workflow rebuilds them and refuses to
        # publish unless the hashes match these pins.
        # Runner OS gate, BEFORE the architecture gate. Windows and Intel macOS
        # both report "x86_64" from `uname -m`, so an arch-only gate downloads
        # the Linux binary, passes the SHA-256 check (the file is intact), and
        # then dies at exec with a confusing exec-format error. Gate on the OS
        # first so the failure names the real cause (issue #2).
        case "$(uname -s)" in
          Linux) ;;
          *)
            echo "smtp-notify: unsupported runner OS: $(uname -s)." >&2
            echo "smtp-notify: only Linux runners are supported; the released" >&2
            echo "smtp-notify: binaries are static linux-musl builds." >&2
            exit 1
            ;;
        esac
        case "$(uname -m)" in
          x86_64)
            asset="smtp-notify-x86_64-linux-musl"
            sha256="2683da8f619dd5f310c9f6884da39e825c807c2c86a6319c19aba39b27f9c5c9"
            ;;
          aarch64)
            asset="smtp-notify-aarch64-linux-musl"
            sha256="a58138308fb9832e1ceb551a12f1b04e591dc38ba5fd336c9acfb3f263161f29"
            ;;
          *)
            echo "smtp-notify: unsupported runner architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac
        url="https://github.com/hyperpolymath/smtp-notify-action/releases/download/v0.5.0/${asset}"
        curl -fsSL --retry 3 --retry-delay 2 -o "${RUNNER_TEMP}/smtp-notify" "$url"
        echo "${sha256}  ${RUNNER_TEMP}/smtp-notify" | sha256sum -c -
        chmod +x "${RUNNER_TEMP}/smtp-notify"

    - name: Send the notification
      shell: bash
      env:
        SMTP_ADDR: ${{ inputs.server_address }}
        SMTP_PORT: ${{ inputs.server_port }}
        SMTP_PROTOCOL: ${{ inputs.protocol }}
        SMTP_SECURE: ${{ inputs.secure }}
        SMTP_HANDSHAKE_ONLY: ${{ inputs.handshake_only }}
        SMTP_DIAGNOSE: ${{ inputs.diagnose }}
        SMTP_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        SMTP_USER: ${{ inputs.username }}
        SMTP_PASS: ${{ inputs.password }}
        MAIL_FROM: ${{ inputs.from }}
        MAIL_TO: ${{ inputs.to }}
        MAIL_NEWSGROUPS: ${{ inputs.newsgroups }}
        MAIL_SUBJECT: ${{ inputs.subject }}
        MAIL_CONTENT_LANGUAGE: ${{ inputs.content_language }}
        MAIL_BODY: ${{ inputs.body }}
      run: exec "${RUNNER_TEMP}/smtp-notify"
