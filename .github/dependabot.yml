# SPDX-License-Identifier: MPL-2.0
# Dependabot covers the one ecosystem this repository has that it can read:
# the GitHub Actions used by .github/workflows/. The Zig build has
# `.dependencies = .{}`, so there is nothing else to watch.
#
# The previous file was GitHub's template with `package-ecosystem: ""`, which
# Dependabot rejects as invalid config — so nothing was being watched at all.
#
# Workflows are pinned through `.github/workflows/actions.lock`
# (gh actions-lock). A Dependabot bump to a workflow MUST be followed, in the
# same PR, by `gh actions-lock` so the lock matches; the estate sweep of
# 2026-09-30 found eight repositories where exactly that step was skipped.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
