name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ZIG_TARBALL: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00

jobs:
  zig-test:
    name: Unit tests + release targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Zig 0.16.0 (sha256-pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zig.tar.xz "$ZIG_TARBALL"
          echo "$ZIG_SHA256  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig-toolchain"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig-toolchain" --strip-components=1
          echo "$HOME/zig-toolchain" >> "$GITHUB_PATH"
      - name: Unit tests (scripted sessions + spec golden vectors)
        run: zig build test
      - name: Release targets compile (both shipped arches)
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-linux-musl

  fsm-drift:
    name: FSM drift gate (spec is source of truth)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/stefan-hoeck/idris2-pack@sha256:f0758996a931fb35d9ecb1de273c4d59dabe2a09b433afc7e357f65a08b7e1ff
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Regenerate from the proven spec and diff (with selftest)
        # A job log needs a signed-in session, so a failure here reaches
        # `gh api .../check-runs/<id>/annotations` but not an unauthenticated
        # reader or an agent triaging the PR. Mirror the output into
        # annotations as well: a gate whose reason cannot be read is a gate
        # that gets re-run hopefully instead of fixed.
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if bash scripts/check-fsm-drift.sh --selftest >"$log" 2>&1; then
            cat "$log"
          else
            status=$?
            cat "$log"
            while IFS= read -r line; do
              printf '::error::%s\n' "${line//\%/%25}"
            done < <(head -n 45 "$log")
            exit "$status"
          fi

  action-metadata:
    name: action.yml metadata gate (Marketplace)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      # The Marketplace refuses a description of 125 characters or more, and
      # it reads action.yml from the release tag — so the cheapest place to
      # catch it is here, on the pull request, rather than in the publish form
      # after the tag exists. See scripts/check-action.sh for the two
      # measurement traps it closes.
      - name: Description is publishable (with selftest)
        run: bash scripts/check-action.sh --selftest

  e2e-mailpit:
    name: E2E delivery vs containerized sink
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mailpit:
        image: axllent/mailpit@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68 # v1.27
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Zig 0.16.0 (sha256-pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zig.tar.xz "$ZIG_TARBALL"
          echo "$ZIG_SHA256  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig-toolchain"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig-toolchain" --strip-components=1
          echo "$HOME/zig-toolchain" >> "$GITHUB_PATH"
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
      - name: Diagnose delivers nothing and reports every stage
        # diagnose must never authenticate or send, even with a full mail
        # configuration present. The sink must still be empty afterwards.
        env:
          SMTP_ADDR: localhost
          SMTP_PORT: '1025'
          SMTP_SECURE: 'plaintext'
          SMTP_DIAGNOSE: 'true'
          SMTP_USER: ci
          SMTP_PASS: ci
          MAIL_FROM: CI <ci@example.test>
          MAIL_TO: sink@example.test
          MAIL_SUBJECT: 'must not arrive'
          MAIL_BODY: 'must not arrive'
        run: |
          set -euo pipefail
          out="$(./zig-out/bin/smtp-notify 2>&1)"
          echo "$out"
          for stage in DNS TCP TLS EHLO AUTH MSG; do
            echo "$out" | grep -Eq "diagnose: ${stage} +(ok|skipped) " || { echo "stage ${stage} not reported ok" >&2; exit 1; }
          done
          count="$(curl -fsS http://localhost:8025/api/v1/messages | jq -er '.total')"
          [ "$count" = "0" ] || { echo "diagnose delivered $count message(s)" >&2; exit 1; }
      - name: Diagnose names the failing stage (nothing listening)
        env:
          SMTP_ADDR: localhost
          SMTP_PORT: '1026'
          SMTP_SECURE: 'plaintext'
          SMTP_DIAGNOSE: 'true'
        run: |
          set -euo pipefail
          if out="$(./zig-out/bin/smtp-notify 2>&1)"; then
            echo "diagnose against a closed port exited 0" >&2; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q 'diagnose: TCP  FAIL' || { echo "TCP failure not attributed" >&2; exit 1; }
          echo "$out" | grep -q 'diagnose: EHLO not-reached' || { echo "later stages not marked" >&2; exit 1; }
      - name: Malformed or injecting Content-Language is refused before sending
        env:
          SMTP_ADDR: localhost
          SMTP_PORT: '1025'
          SMTP_SECURE: 'plaintext'
          SMTP_USER: ci
          SMTP_PASS: ci
          MAIL_FROM: CI <ci@example.test>
          MAIL_TO: sink@example.test
          MAIL_SUBJECT: 'must not arrive'
          MAIL_BODY: 'must not arrive'
        run: |
          set -euo pipefail
          # Each refusal must be THE refusal, not any non-zero exit.
          check() { # $1 value, $2 expected message fragment
            if out="$(MAIL_CONTENT_LANGUAGE="$1" ./zig-out/bin/smtp-notify 2>&1)"; then
              echo "accepted Content-Language: $(printf %q "$1")" >&2; exit 1
            fi
            echo "$out"
            echo "$out" | grep -qF "$2" || { echo "refused for the wrong reason" >&2; exit 1; }
          }
          check 'en_GB' 'MAIL_CONTENT_LANGUAGE is not a comma-separated list'
          check $'en\r\nBcc: victim@example.test' 'CR/LF in a header-bound input'
          count="$(curl -fsS http://localhost:8025/api/v1/messages | jq -er '.total')"
          [ "$count" = "0" ] || { echo "a refused message was delivered" >&2; exit 1; }
      - name: Deliver a mail with a dot-stuffing hazard in the body
        env:
          SMTP_ADDR: localhost
          SMTP_PORT: '1025'
          SMTP_SECURE: 'plaintext'
          SMTP_USER: ci
          SMTP_PASS: ci
          MAIL_FROM: CI <ci@example.test>
          MAIL_TO: sink@example.test
          MAIL_SUBJECT: 'smtp-notify e2e — ŵ 🎉 — a subject long enough to fold onto continuation lines, in Welsh: Llongyfarchiadau ar wthio i’r brif gangen'
          MAIL_CONTENT_LANGUAGE: ' en-GB ,cy'
          MAIL_BODY: |
            line one
            .a line starting with a dot must survive stuffing
            last line
        run: ./zig-out/bin/smtp-notify
      - name: Assert the sink received it intact
        run: |
          set -euo pipefail
          count="$(curl -fsS http://localhost:8025/api/v1/messages | jq -er '.total')"
          [ "$count" = "1" ] || { echo "expected exactly 1 message, sink holds $count" >&2; exit 1; }
          id="$(curl -fsS http://localhost:8025/api/v1/messages | jq -er '.messages[0].ID')"
          # The raw endpoint returns SMTP wire format: CRLF line endings.
          # Strip the CRs once here so the whole-line (-x) greps below can
          # match; without this the invisible trailing \r fails every -x.
          raw="$(curl -fsS "http://localhost:8025/api/v1/message/${id}/raw" | tr -d '\r')"
          echo "$raw" | grep -qx '\.a line starting with a dot must survive stuffing' || {
            echo "dot-stuffed line did not round-trip; raw message:" >&2
            echo "$raw" >&2
            exit 1
          }
          # The raw header must be an encoded-word (no 8-bit bytes in the
          # header), and the sink's own decoding must give the text back.
          echo "$raw" | grep -q '^Subject: =?UTF-8?B?' || { echo "subject not RFC 2047 encoded" >&2; exit 1; }
          subject="$(curl -fsS http://localhost:8025/api/v1/messages | jq -er '.messages[0].Subject')"
          [ "$subject" = 'smtp-notify e2e — ŵ 🎉 — a subject long enough to fold onto continuation lines, in Welsh: Llongyfarchiadau ar wthio i’r brif gangen' ] || { echo "subject decoded as: $subject" >&2; exit 1; }
          echo "$raw" | grep -qx 'Content-Language: en-GB, cy' || { echo "Content-Language missing" >&2; exit 1; }
          # RFC 2047 §2: a line carrying an encoded-word is at most 76 chars.
          echo "$raw" | awk '/=\?UTF-8\?B\?/ && length($0) > 76 { bad = 1; print "over 76: " $0 } END { exit bad }' >&2
          echo "e2e ok: delivered, dot-stuffing round-tripped, subject and language intact"

  e2e-nntp:
    name: E2E news post vs fixture sink
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Zig 0.16.0 (sha256-pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zig.tar.xz "$ZIG_TARBALL"
          echo "$ZIG_SHA256  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig-toolchain"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig-toolchain" --strip-components=1
          echo "$HOME/zig-toolchain" >> "$GITHUB_PATH"
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
      # scripts/nntp-sink.py is a test fixture: a one-shot NNTP server that
      # answers the dialogue and records what the binary actually sent. It is
      # the news counterpart of the Mailpit container above, because no NNTP
      # server is available as a sha256-pinned container.
      - name: Post an article and assert what went on the wire
        run: bash scripts/ci-nntp-post.sh
      - name: Refusals name their own reason
        run: bash scripts/ci-nntp-refusals.sh
      - name: Inputs that cannot be right are refused before any connection
        run: bash scripts/ci-nntp-inputs.sh
      - name: Handshake-only posts nothing
        run: bash scripts/ci-nntp-handshake.sh

  tls-handshake:
    # Live canary for the vendored TLS client (certificate_request patch,
    # ziglang/zig#19521): full TLS 1.3 handshake + EHLO + QUIT against a
    # Google-hosted SMTPS endpoint, which requests a client certificate.
    # NOT a required context: it depends on an external host.
    name: Live TLS handshake canary (gmail:465)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Zig 0.16.0 (sha256-pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zig.tar.xz "$ZIG_TARBALL"
          echo "$ZIG_SHA256  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig-toolchain"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig-toolchain" --strip-components=1
          echo "$HOME/zig-toolchain" >> "$GITHUB_PATH"
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
      - name: Handshake-only probe (no auth, nothing sent)
        env:
          SMTP_HANDSHAKE_ONLY: 'true'
          SMTP_SECURE: 'true'
          SMTP_ADDR: smtp.gmail.com
          SMTP_PORT: '465'
        run: ./zig-out/bin/smtp-notify
      - name: Diagnose probe, STARTTLS on 587 (no auth, nothing sent)
        env:
          SMTP_DIAGNOSE: 'true'
          SMTP_SECURE: 'starttls'
          SMTP_ADDR: smtp.gmail.com
          SMTP_PORT: '587'
        run: ./zig-out/bin/smtp-notify
